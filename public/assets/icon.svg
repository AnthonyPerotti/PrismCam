<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="prism-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>
    <linearGradient id="prism-spectrum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="35%" stop-color="#7928ca" />
      <stop offset="70%" stop-color="#ff0080" />
      <stop offset="100%" stop-color="#ffbe3b" />
    </linearGradient>
    <linearGradient id="lens-reflect" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0.25" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#prism-bg)" stroke="#22304d" stroke-width="6"/>

  <!-- Glowing Prismatic Polygon (Triangle) -->
  <polygon points="256,70 440,390 72,390" fill="none" stroke="url(#prism-spectrum)" stroke-width="14" stroke-linejoin="round" filter="url(#glow)"/>
  <polygon points="256,70 440,390 72,390" fill="none" stroke="url(#prism-spectrum)" stroke-width="8" stroke-linejoin="round"/>

  <!-- Camera Body Center -->
  <circle cx="256" cy="275" r="92" fill="#0d1424" stroke="url(#prism-spectrum)" stroke-width="6"/>
  
  <!-- Optical Ring & Elements -->
  <circle cx="256" cy="275" r="76" fill="#121b30" stroke="#00d4ff" stroke-width="3" stroke-opacity="0.6"/>
  <circle cx="256" cy="275" r="54" fill="url(#lens-reflect)" stroke="#ff0080" stroke-width="2" stroke-opacity="0.7"/>
  <circle cx="256" cy="275" r="26" fill="#00d4ff" opacity="0.85"/>
  <circle cx="266" cy="265" r="8" fill="#ffffff" opacity="0.9"/>

  <!-- PTZ Crosshair Indicators -->
  <line x1="256" y1="150" x2="256" y2="168" stroke="#00d4ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="382" x2="256" y2="400" stroke="#ff0080" stroke-width="4" stroke-linecap="round"/>
  <line x1="130" y1="275" x2="148" y2="275" stroke="#7928ca" stroke-width="4" stroke-linecap="round"/>
  <line x1="364" y1="275" x2="382" y2="275" stroke="#ffbe3b" stroke-width="4" stroke-linecap="round"/>

  <!-- PTZ Rotation Arrows Orbit -->
  <path d="M 200 120 A 165 165 0 0 1 312 120" fill="none" stroke="#00d4ff" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.8"/>
  <path d="M 405 235 A 165 165 0 0 1 390 340" fill="none" stroke="#ffbe3b" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.8"/>
  <path d="M 122 340 A 165 165 0 0 1 107 235" fill="none" stroke="#ff0080" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.8"/>

  <!-- Stream Indicator LED -->
  <circle cx="256" cy="435" r="8" fill="#10b981" filter="url(#glow)"/>
  <circle cx="256" cy="435" r="4" fill="#ffffff"/>
</svg>
